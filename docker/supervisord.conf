; CONTAINER_ROLE=all: web server, queue worker and scheduler in one container, each restarted if it
; exits. Logs go to the container's stdout/stderr.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:web]
command=frankenphp run --config /etc/frankenphp/Caddyfile
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
; default first: submissions and webhook events before image copies. Timeout stays below the
; queue's 90 s retry_after. Graceful stop waits for the current job.
command=php /app/artisan queue:work --queue=default,images --sleep=1 --tries=3 --timeout=80 --max-time=3600 --memory=256
autorestart=true
startsecs=3
stopwaitsecs=90
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
; Runs the Pixelforge poller every minute (missed webhooks, lost jobs, image copies).
command=php /app/artisan schedule:work
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
